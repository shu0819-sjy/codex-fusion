name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  host:
    name: Rust host check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: host/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host/src-tauri
      - run: cargo check --locked
      - run: cargo test --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo fmt --check

  dynamic-effects:
    name: Dynamic effects engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/dynamic-effects.test.mjs
        working-directory: host/src-tauri

  powershell:
    name: PowerShell process-switch tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Pester suite
        shell: pwsh
        run: ./tests/run-pester.ps1
