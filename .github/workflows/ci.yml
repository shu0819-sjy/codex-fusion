name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend / ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['20', '22']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Run frontend tests
        run: npm test

  host:
    name: Rust host check (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: host/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Install locked host CLI dependencies
        working-directory: host
        run: npm ci --ignore-scripts
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host/src-tauri
      - run: cargo check --locked
      - run: cargo test --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo fmt --check

  dynamic-effects:
    name: Dynamic effects engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/dynamic-effects.test.mjs
        working-directory: host/src-tauri

  powershell:
    name: PowerShell process-switch tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run Pester suite
        shell: pwsh
        run: ./tests/run-pester.ps1
